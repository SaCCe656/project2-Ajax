<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Music Explorer</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="container">
      <!-- Search bar -->
      <div class="search-bar">
        <input type="text" id="artist-search" placeholder="Search artist:" />
      </div>

      <!-- Artist information -->
      <div class="artist-container">
        <h2 id="artist-name">Band/Artist</h2>

        <div class="information">
          <!-- Popular songs -->
          <div class="songs">
            <h3>Popular songs:</h3>

            <ol id="song-list">
              <li>Song 1</li>
              <li>Song 2</li>
              <li>Song 3</li>
              <li>Song 4</li>
              <li>Song 5</li>
            </ol>
          </div>

          <!-- Artist statistics -->
          <div class="statistics">
            <h3>Artist Statistics:</h3>

            <p>Listeners:</p>
            <p id="listeners">-</p>

            <p>Similar artists:</p>
            <p id="similar-artists">-</p>
          </div>
          <div class="albums">
            <h3>Popular Albums</h3>

            <ul id="album-list"></ul>
          </div>
        </div>
      </div>
    </div>
    <script src="script.js"></script>
  </body>
</html>
